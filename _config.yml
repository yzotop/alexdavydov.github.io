# Служебные файлы репозитория, которые Pages не должен отдавать по адресу
# на сайте. Страницы и ресурсы сюда не попадают: assets/redirects.json
# (нужен странице 404), CNAME, robots.txt, sitemap.xml, файлы для
# скачивания со страниц (.py в llm-ab-case и two-sided-interference,
# .xlsx/.csv в telenok) остаются опубликованными.
# Шаблон со «*» у Jekyll 3 захватывает и подкаталоги: "*.md" — все .md.
exclude:
  - "*.md"
  - "*.sh"
  - "*.ts"
  - docs
  - scripts
  - lychee.toml
  - "workspace/articles/*/fig_*.py"
  - cases/ub22/palette/build_data.py
  - cases/ub22/palette/ub_final.csv
  - workspace/simulators/menu-check/build_data.py
  - "workspace/simulators/menu-check/*.csv"
