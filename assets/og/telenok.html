<!DOCTYPE html>
<!-- Источник OG-карточки для /cases/telenok/. Не страница сайта — заготовка
     под скриншот. Пересборка: открыть по адресу /assets/og/telenok.html
     и снять .og в вьюпорте 1200x630, результат в assets/og/telenok.png.
     Шрифты берутся из /style.css, поэтому rsvg-convert тут не годится:
     Manrope и Geist Mono не установлены в системе, он подставит фолбэк.
     Данные — первый график кейса, сокращённый до четырёх ключевых строк:
     на ширине ленты LinkedIn (~500px) все восемь читаются в 4.9px. -->
<html lang="ru"><head><meta charset="UTF-8"><meta name="robots" content="noindex">
<link rel="stylesheet" href="/style.css">
<style>
  html,body{margin:0;padding:0;background:#fff}
  .og{width:1200px;height:630px;background:#fff;display:flex;flex-direction:column;
      padding:54px 56px 44px;box-sizing:border-box;font-family:var(--sans);color:var(--ink)}
  .og-kicker{font-family:var(--mono);font-size:17px;letter-spacing:.16em;text-transform:uppercase;
      color:var(--muted);margin-bottom:20px}
  .og-title{font-size:48px;font-weight:700;line-height:1.06;letter-spacing:-.02em;margin:0 0 16px}
  .og-line{font-size:25px;line-height:1.34;color:#444;margin:0;max-width:60ch}
  .og-chart{flex:1;display:flex;align-items:center;min-height:0;margin-top:22px}
  .og-chart svg{width:100%;height:auto;max-height:100%}
  .og-chart .lab{font-family:var(--sans);font-weight:500;font-size:19px;fill:var(--ink)}
  .og-chart .num{font-family:var(--mono);font-weight:500;font-size:19px;fill:var(--ink)}
  .og-chart .cap{font-family:var(--mono);font-weight:400;font-size:14px;fill:var(--muted)}
</style></head><body><div class="og">
  <div class="og-kicker">davydov.my · кейс</div>
  <h1 class="og-title">Рога и копыта: аудит фирмы, которой не было</h1>
  <p class="og-line">Оклад главного миллионера СССР был меньше, чем средняя семья тратила на еду.</p>
  <div class="og-chart"><svg viewBox="-124 0 956 214" class="chart">
<line x1="334.9" y1="4" x2="334.9" y2="186" stroke="#e63946" stroke-width="2" stroke-dasharray="5 4"/>
<text x="342.9" y="204" class="cap" fill="#e63946">48,51 — расход семьи служащего только на домашнее питание</text>
<text x="238" y="27" class="lab" text-anchor="end">Корейко, конторщик «Геркулеса»</text>
<rect x="250" y="12" width="80.5" height="20" fill="#e63946"/>
<text x="340.5" y="27" class="num" fill="#e63946">46</text>
<text x="238" y="71" class="lab" text-anchor="end">младший обслуживающий персонал</text>
<rect x="250" y="56" width="87.4" height="20" fill="#111111"/>
<text x="347.4" y="71" class="num" fill="#111111">49,94</text>
<text x="238" y="115" class="lab" text-anchor="end">служащий цензовой промышленности</text>
<rect x="250" y="100" width="228.1" height="20" fill="#111111"/>
<text x="488.1" y="115" class="num" fill="#111111">130,37</text>
<text x="238" y="159" class="lab" text-anchor="end">Фунт в тюрьме</text>
<rect x="250" y="144" width="420" height="20" fill="#e63946"/>
<text x="680.0" y="159" class="num" fill="#e63946">240</text>
</svg></div>
</div></body></html>
