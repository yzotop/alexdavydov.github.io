name: Site QA

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

jobs:
  seo-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # courses/index.html больше не генерируется: пять курсов уехали
      # в архив, страница стала заглушкой на /teaching/, а генератор
      # render_courses_hub.py удалён. Генераторов теперь три: карта сайта,
      # хаб /ai-analyst/ и блок серии в статьях. Правило у всех одно —
      # regenerate, затем git diff --exit-code: расхождение валит сборку.
      - name: Regenerate sitemap
        run: python3 scripts/generate_sitemap.py
      - name: Ensure sitemap matches generator
        run: git diff --exit-code sitemap.xml
      # Список разборов на /ai-analyst/ собирался руками и отставал:
      # восьмой разбор вышел 28.09 и на хаб не попал, потому что добавить
      # карточку было отдельным действием, о котором никто не напомнил.
      # Теперь хаб выводится из самих статей, а этот шаг ловит расхождение.
      - name: Regenerate /ai-analyst/ hub
        run: python3 scripts/render_ai_analyst_hub.py
      - name: Ensure hub matches generator
        run: git diff --exit-code ai-analyst/index.html
      # Блок «Вся серия» в конце статей выводится из того же источника,
      # что и хаб. Правка номера, заголовка или подводки без перегенерации
      # оставила бы блоки в остальных статьях устаревшими — шаг это ловит.
      - name: Ensure series blocks match generator
        run: python3 scripts/render_series_block.py && git diff --exit-code workspace/articles

  verification-file:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Файл подтверждения владения доменом в Google Search Console.
      # Google перепроверяет подтверждение периодически, поэтому порча
      # или удаление файла = молчаливая потеря доступа к данным поиска
      # через недели. Раньше файл был защищён только косвенно: массовый
      # проход promote_articles_navbar.py по ROOT.rglob("*.html") его
      # не трогает лишь потому, что внутри нет блока nav-links.
      # sha256sum -c валит сборку и при изменении, и при отсутствии файла.
      - name: Google verification file intact
        run: |
          echo "ddcd5ce0ab04a37986ed1edaaa1b7ce1ea764c806a52f85fdc1e21af264578c1  google9b84a06f40ea405c.html" \
            | sha256sum -c -

  redirect-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # lychee читает <a href> и не читает <meta http-equiv="refresh">:
      # заглушка, ведущая в 404, и цепочка из двух заглушек для него
      # выглядят как обычные живые ссылки. Этот скрипт смотрит на url=
      # внутри meta refresh — то, по чему на самом деле уезжает браузер.
      - name: Redirect stubs resolve in one hop
        run: python3 scripts/check_redirects.py

  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Без continue-on-error: битая ссылка должна валить сборку.
      # Хосты, которые блокируют ботов целиком (LinkedIn, Telegram,
      # Medium), исключены в lychee.toml — они не создают ложных красных.
      - name: Link check (HTML)
        uses: lycheeverse/lychee-action@v2
        with:
          # Версия закреплена намеренно. Без неё action тянет свою, и числа
          # прогона меняются без единой правки в репозитории: 0.22 и 0.24.2
          # на одном коммите дали 2172 и 2853 проверки. Закрепление делает
          # локальный прогон воспроизводимым — это дороже автообновлений.
          lycheeVersion: v0.24.2
          args: --config lychee.toml './**/*.html'

  lighthouse-sample:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lighthouse (production sample)
        uses: treosh/lighthouse-ci-action@v12
        with:
          # /courses/ и /lab/ стали заглушками — мерить на них нечего.
          urls: |
            https://davydov.my/
            https://davydov.my/ai-analyst/
            https://davydov.my/cases/
          uploadArtifacts: true
        continue-on-error: true
