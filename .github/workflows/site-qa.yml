name: Site QA

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

jobs:
  seo-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate sitemap and courses hub
        run: |
          python3 scripts/generate_sitemap.py
          python3 scripts/render_courses_hub.py
      - name: Ensure sitemap and courses hub match generators
        run: git diff --exit-code sitemap.xml courses/index.html

  verification-file:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Файл подтверждения владения доменом в Google Search Console.
      # Google перепроверяет подтверждение периодически, поэтому порча
      # или удаление файла = молчаливая потеря доступа к данным поиска
      # через недели. Раньше файл был защищён только косвенно: массовый
      # проход promote_articles_navbar.py по ROOT.rglob("*.html") его
      # не трогает лишь потому, что внутри нет блока nav-links.
      # sha256sum -c валит сборку и при изменении, и при отсутствии файла.
      - name: Google verification file intact
        run: |
          echo "ddcd5ce0ab04a37986ed1edaaa1b7ce1ea764c806a52f85fdc1e21af264578c1  google9b84a06f40ea405c.html" \
            | sha256sum -c -

  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Без continue-on-error: битая ссылка должна валить сборку.
      # Хосты, которые блокируют ботов целиком (LinkedIn, Telegram,
      # Medium), исключены в lychee.toml — они не создают ложных красных.
      - name: Link check (HTML)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml './**/*.html'

  lighthouse-sample:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lighthouse (production sample)
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://davydov.my/
            https://davydov.my/courses/
            https://davydov.my/lab/
          uploadArtifacts: true
        continue-on-error: true
