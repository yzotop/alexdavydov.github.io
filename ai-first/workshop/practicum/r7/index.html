<main><p class="eyebrow">Практикум　/　Передача недельного отчёта</p>
<h1 id="title" tabindex="-1"></h1><p class="lead" id="lead"></p><section id="screen"></section>
<footer>Учебная розничная сеть · Сентябрь 2025 · События возврата, UTC <span id="warning" role="status"></span></footer></main>
<script id="sources" type="application/json">{"late-response.json": "{\"synthetic\":true,\"source_id\":\"27\",\"revision_id\":\"42-r2\",\"query_status\":\"success\",\"received_at_utc\":\"2025-09-24T10:30:00Z\",\"in_reply_to_report_sha256\":\"be68a3b26accdbfd04a37244d089e683842c6a1614e8c87cb5e61252e6aa6b93\",\"region_id\":\"R7\",\"week_start_utc\":\"2025-09-15T00:00:00Z\",\"week_end_exclusive_utc\":\"2025-09-22T00:00:00Z\",\"coverage_attestation\":{\"complete_for_scope\":true,\"covered_branch_ids\":[\"C5\",\"C8\"],\"issuer\":\"synthetic-exporter\",\"region_id\":\"R7\",\"source_id\":\"27\",\"revision_id\":\"42-r2\",\"week_start_utc\":\"2025-09-15T00:00:00Z\",\"week_end_exclusive_utc\":\"2025-09-22T00:00:00Z\"},\"rows\":[{\"branch_id\":\"C5\",\"return_event_count\":9,\"row_ref\":\"R7-C5-20250915-final\"},{\"branch_id\":\"C8\",\"return_event_count\":5,\"row_ref\":\"R7-C8-20250915-final\"}],\"record_notes\":\"Final weekly counts for both listed branches; C5 unchanged, C8 supplied in response to earlier request. Receipt date is not event date.\"}\n", "metric-and-rules.md": "# Метрика и договор источника\n\nДанные учебные, синтетические. Регион R7 за указанную неделю состоит ровно из филиалов C5 и C8. Филиалы не пересекаются.\n\nМетрика return_event_count — число событий возврата в одном филиале за весь интервал UTC: начало включено, конец не включён. Это не число клиентов, заказов и не сумма денег. Значения — неотрицательные целые. Каждая выданная строка содержит окончательное корректное значение филиала за всю неделю.\n\nФормат разреженный. Договор разрешает трактовать отсутствующую строку как ноль только для источника с coverage_attestation.complete_for_scope=true, если covered_branch_ids совпадает с полным составом региона за весь указанный интервал. Такая аттестация относится к области данного файла. Если аттестации нет, источник не гарантирует выдачу всех строк региона. Статус query_status описывает выполнение запроса, а не полноту покрытия.\n\nДля недельной передачи действует тот же состав R7 в обоих периодах. source_id обозначает ряд выгрузок; конкретный срез определяется также интервалом. Если у аттестации явно указаны собственные регион, source_id или границы интервала, проверяются именно эти поля: они должны совпадать с областью используемых данных. Если таких полей внутри нет, область берётся из родительского файла. Положительный флаг полноты сам по себе не отменяет её область действия.\n", "prior-report.md": "Прежний вывод можно сохранить **для первого периода**: он подтверждается исходными файлами. На вторую неделю его переносить нельзя.\n\n| Период UTC | C8 | Регион R7 |\n|---|---:|---:|\n| [08.09.2025; 15.09.2025) | **0 событий возврата** | **6 событий возврата** |\n| [15.09.2025; 22.09.2025) | **целое число ≥ 0**, конечная верхняя граница не установлена | **целое число ≥ 9**, конечная верхняя граница не установлена |\n\n**Основания первого периода.** В `records-27.json` строка C5 равна 6. Аттестация подтверждает полный охват C5/C8; собственные границы внутри неё отсутствуют, поэтому согласно `metric-and-rules.md` она наследует интервал родительского файла. Отсутствие строки C8 означает ноль. Филиалы не пересекаются и полностью составляют R7, поэтому региональный итог равен 6.\n\n**Основания второго периода.** В `records-42.json` окончательное недельное значение C5 равно 9. Однако вложенная аттестация явно относится к **08–15 сентября**, а данные файла — к **15–22 сентября**. Совпадение региона, `source_id` и списка филиалов не устраняет несовпадение интервала. Поэтому отсутствие C8 здесь не подтверждает ноль; `query_status: success` полноты также не доказывает. Обозначив число событий C8 как \\(n\\), получаем \\(n∈\\mathbb{Z}_{≥0}\\), R7 = \\(9+n\\).\n\n**Какого свидетельства не хватает.** Для точного второго итога достаточно окончательной строки C8 за 15–22 сентября. Альтернатива для подтверждения именно нуля — действительная аттестация полного охвата C5/C8 для R7, `source_id=\"27\"` и интервала `[2025-09-15T00:00:00Z; 2025-09-22T00:00:00Z)`, распространяющаяся на используемый срез при отсутствии строки C8.\n\nДополнительно можно подтвердить: региональный итог второй недели **больше первого минимум на 3 события**; точный прирост равен \\(3+n\\). Рост C5 с 6 до 9 подтверждён точно.\n", "question.md": "Подготовь короткую поправку руководителю по возвратам R7 за 15–21 сентября 2025 после ответа источника. Укажи итог и прирост к прежней неделе, какие записи уточнили вывод и как сохранить прежний отчёт.\n", "records-27.json": "{\"synthetic\":true,\"region_id\":\"R7\",\"week_start_utc\":\"2025-09-08T00:00:00Z\",\"week_end_exclusive_utc\":\"2025-09-15T00:00:00Z\",\"query_status\":\"success\",\"coverage_attestation\":{\"complete_for_scope\":true,\"covered_branch_ids\":[\"C5\",\"C8\"],\"issuer\":\"synthetic-exporter\"},\"rows\":[{\"branch_id\":\"C5\",\"return_event_count\":6}],\"source_id\":\"27\"}\n", "records-42.json": "{\"synthetic\":true,\"region_id\":\"R7\",\"week_start_utc\":\"2025-09-15T00:00:00Z\",\"week_end_exclusive_utc\":\"2025-09-22T00:00:00Z\",\"query_status\":\"success\",\"coverage_attestation\":{\"complete_for_scope\":true,\"covered_branch_ids\":[\"C5\",\"C8\"],\"issuer\":\"synthetic-exporter\",\"region_id\":\"R7\",\"source_id\":\"27\",\"week_start_utc\":\"2025-09-08T00:00:00Z\",\"week_end_exclusive_utc\":\"2025-09-15T00:00:00Z\"},\"rows\":[{\"branch_id\":\"C5\",\"return_event_count\":9}],\"source_id\":\"27\"}\n", "first-answer.md": "**Поправка по возвратам R7 за 15–21 сентября 2025**\n\nПо окончательному ответу источника `27`, ревизия `42-r2`, итог — **14 событий возврата**: C5 — 9, C8 — 5. За 8–14 сентября было 6, поэтому точный прирост — **8 событий**.\n\nВывод уточнили записи `R7-C5-20250915-final` — C5 осталось 9 — и `R7-C8-20250915-final` — получено C8 = 5. Аттестация новой ревизии подтверждает полный охват обоих филиалов именно за нужную неделю; прежняя неопределённость снята.\n\nПрежний отчёт сохранить без изменений как версию до ответа источника. Добавить эту поправку с датой получения ответа **24.09.2025, 10:30 UTC** и ссылкой на `late-response.json`. Вывод за первую неделю остаётся действительным.\n\nМатериалы синтетические. Все шесть хешей проверены; ответ источника привязан к хешу прежнего отчёта.\n"}</script>
<script>
'use strict';
const sources=JSON.parse(document.getElementById('sources').textContent);
const late=JSON.parse(sources['late-response.json']);
const firstWeek=JSON.parse(sources['records-27.json']);
const nextWeek=JSON.parse(sources['records-42.json']);
const key='davydov.practicum.r7.late-update.v1';
const blank={draft:{},first:null,handoff:null,view:'before'};
let state=structuredClone(blank), storageIssue=false;
try {const saved=JSON.parse(localStorage.getItem(key));if(saved&&saved.draft)state={...blank,...saved};}catch{storageIssue=true}
const screen=document.querySelector('#screen');
const esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
function warn(){document.querySelector('#warning').textContent=storageIssue?' · Браузер ограничил локальное сохранение. Скопируйте свой текст до закрытия страницы.':''}
function save(){try{localStorage.setItem(key,JSON.stringify(state));storageIssue=false}catch{storageIssue=true}warn()}
function raw(file,label=file){return '<details><summary>'+esc(label)+'</summary><pre>'+esc(sources[file])+'</pre></details>'}
function field(id,label,rows=2){return '<label>'+label+'<textarea required rows="'+rows+'" id="'+id+'">'+esc(state.draft[id])+'</textarea></label>'}
function buttons(id,text){return '<button class="primary" type="submit" id="'+id+'">'+text+'</button>'}
function display(id,name,obj){return '<p><strong>'+name+'</strong><br><span class="writeup" id="'+id+'">'+esc(obj)+'</span></p>'}
function sheet(left,right){return '<div class="layout"><article>'+left+'</article><aside>'+right+'</aside></div>'}
function switchTo(view){state.view=view;save();render();document.querySelector('#title').focus();window.scrollTo(0,0)}
function period(d){return d.week_start_utc.slice(0,10)+' → '+d.week_end_exclusive_utc.slice(0,10)}
function bindForm(id,names,onSubmit){const form=document.getElementById(id);form.oninput=e=>{state.draft[e.target.id]=e.target.value;save()};form.onsubmit=e=>{e.preventDefault();const obj={};for(const n of names){const el=document.getElementById(n);if(!el.value.trim()){el.focus();return}obj[n]=el.value.trim()}onSubmit(obj)}}
function early(){
 const left='<h2>Записка предыдущей смены</h2><p class="note">За первую неделю по региону подтверждено 6 событий возврата. За следующую в сводке стоит «не менее 9». Какую цифру можно передать руководителю сегодня?</p>'+raw('prior-report.md','Открыть переданный отчёт целиком')+
 '<h3>Что было у аналитика</h3><p>Регион R7 состоит из двух филиалов, C5 и C8. Граница окончания периода в таблице исключена.</p><table><thead><tr><th>Выгрузка</th><th>Неделя данных, UTC</th><th>Строки</th><th>Период подтверждения полноты</th></tr></thead><tbody>'+
 [firstWeek,nextWeek].map((d,i)=>'<tr><td>records-'+(i?'42':'27')+'</td><td>'+period(d)+'</td><td>C5 · '+d.rows[0].return_event_count+'</td><td>'+(i?period(d.coverage_attestation):'По периоду файла')+'</td></tr>').join('')+'</tbody></table>'+
 raw('records-27.json')+raw('records-42.json')+raw('metric-and-rules.md','Прочитать договор источника');
 const right=state.first?'<h2>Ваша первая запись</h2>'+display('original','Формулировка',state.first.initial)+display('requested','Запрос',state.first.request)+'<button class="primary" id="resume">К ответу филиала</button>':
 '<h2>Ваша первая запись</h2><form id="beforeForm">'+field('initial','Что вы сейчас скажете руководителю о числе возвратов и его изменении?',3)+field('request','Какие сведения запросите для точного итога?',2)+buttons('lock','Сохранить и открыть ответ филиала')+'</form><small>Эта версия останется в передаче коллеге.</small>';
 screen.innerHTML=sheet(left,right);
 if(state.first)document.querySelector('#resume').onclick=()=>switchTo('after');
 else bindForm('beforeForm',['initial','request'],obj=>{state.first=obj;switchTo('after')})
}
function after(){
 const rows=late.rows.map(r=>'<tr><td>'+r.branch_id+'</td><td>'+r.return_event_count+'</td><td>'+esc(r.row_ref)+'</td></tr>').join('');
 const left='<button class="back" id="previous">← К исходным данным</button><h2>Ответ источника '+esc(late.source_id)+'</h2><p class="note">Получен 24 сентября в 10:30 UTC. Филиал прислал окончательные недельные строки по региону R7.</p><p><b>Период событий</b>　15–21 сентября 2025, UTC<br><b>Ревизия</b>　'+esc(late.revision_id)+'<br><b>Покрытие</b>　C5 и C8, подтверждено за тот же период</p>'+
 '<table><thead><tr><th>Филиал</th><th>События</th><th>Идентификатор строки</th></tr></thead><tbody>'+rows+'</tbody></table>'+raw('late-response.json','Открыть полученную запись целиком')+'<h3>До ответа филиала</h3>'+display('beforeText','Ваша формулировка',state.first.initial)+display('beforeRequest','Вы запросили',state.first.request);
 const right=state.handoff?'<h2>Передача сохранена</h2>'+display('sent','Руководителю',state.handoff.message)+'<button id="read" class="primary">Открыть сверку и передачу</button>':
 '<h2>Передача коллеге</h2><form id="afterForm">'+field('calc','Новый итог и изменение к первой неделе. Покажите расчёт.')+field('basis','Какая запись уточнила вывод? Укажите файл или идентификатор строки.',1)+field('reason','Чем была обоснована прежняя формулировка?')+field('message','Какую поправку вы передадите руководителю?')+buttons('commit','Сохранить передачу и открыть сверку')+'</form>';
 screen.innerHTML=sheet(left,right);
 document.querySelector('#previous').onclick=()=>switchTo('before');
 if(state.handoff)document.querySelector('#read').onclick=()=>switchTo('review');
 else bindForm('afterForm',['calc','basis','reason','message'],obj=>{state.handoff=obj;switchTo('review')})
}
function exportNote(){
 const f=state.first,h=state.handoff;
 const sections=['Возвраты R7 · Передача коллеге','До ответа филиала\n'+f.initial,'Запрос источнику\n'+f.request,'После ответа · '+late.revision_id+' · получен '+late.received_at_utc+'\n'+h.calc,'Основание\n'+h.basis,'Почему прежний вывод был обоснован\n'+h.reason,'Руководителю\n'+h.message];
 if(state.draft.amend?.trim())sections.push('Моя поправка после сверки\n'+state.draft.amend.trim());
 const url=URL.createObjectURL(new Blob([sections.join('\n\n')],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='R7 — передача коллеге.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)
}
function review(){
 const h=state.handoff;
 const left='<button class="back" id="previous">← К полученным строкам</button><h2>Авторская сверка</h2><p class="note">За 15–21 сентября подтверждены 14 событий возврата. Это на 8 событий больше, чем за предыдущую неделю.</p><p>До ответа филиала были известны 9 событий C5. В выгрузке отсутствовала строка C8, а подтверждение полноты относилось к первой неделе. На тот момент нижняя граница «не менее 9» была обоснована.</p><p>В ревизии 42-r2 строки C5 и C8 окончательные для одной недели: 9 + 5 = 14. Предыдущий недельный итог равен 6. Точный прирост — 14 − 6 = 8. Дата получения ответа, 24 сентября, фиксирует момент пересмотра.</p>'+raw('question.md','Исходное поручение после ответа')+raw('first-answer.md','Первая выдача агента целиком');
 const right='<h2>Ваша передача</h2>'+display('v1','Первоначальный вывод',state.first.initial)+display('vrequest','Запрос',state.first.request)+display('v2','Пересчёт',h.calc)+display('ref','Основание',h.basis)+display('why','Прежний вывод',h.reason)+display('memo','Руководителю',h.message)+'<label>Моя поправка после сверки (по желанию)<textarea id="amend" rows="2">'+esc(state.draft.amend)+'</textarea></label><button class="primary" id="export">Скачать передачу в TXT</button>';
 screen.innerHTML=sheet(left,right);document.querySelector('#previous').onclick=()=>switchTo('after');document.querySelector('#amend').oninput=e=>{state.draft.amend=e.target.value;save()};document.querySelector('#export').onclick=exportNote
}
function render(){let v=state.view;if(!state.first)v='before';if(v==='review'&&!state.handoff)v='after';
 const titles={before:'Что уже можно сказать о возвратах R7?',after:'Как изменится недельная сводка?',review:'Что получит следующая смена?'};
 const leads={before:'Руководитель сравнивает две недели сентября. Проверьте записку коллеги и решите, что сообщить до ответа филиала C8.',after:'Филиал ответил на запрос. Пересчитайте итог и передайте коллеге поправку, которую он сможет проверить.',review:'Сопоставьте свою записку с основаниями и сохраните обе версии для коллеги.'};
 document.querySelector('#title').textContent=titles[v];document.querySelector('#lead').textContent=leads[v];
 ({before:early,after:after,review:review})[v]();warn()}
render();
</script><script data-goatcounter="https://davydov.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script></body></html>
