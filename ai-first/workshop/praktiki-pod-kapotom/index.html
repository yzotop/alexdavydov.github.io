 if(shift.stage===0)return '<h3 id="shift-heading" tabindex="-1">Один счёт до планёрки</h3><div class="shift-message"><b>Руководитель финансовой команды</b><p>«Подготовь решение по INV-100: какие строки бухгалтер может внести в реестр и что ещё нужно уточнить. Мне нужна короткая записка с расчётом и ссылкой на поле документа».</p></div><p>Ты — аналитик. Агент поможет извлечь строки, а ты определишь проверку и границу применения результата.</p><p>За смену ты получишь опыт практика, проверишь документ и заберёшь свою записку в TXT.</p><p class="small">Учебная ситуация и диалоги созданы для игры. INV-100 — пример Azure Samples. Илья описал свой способ сверки других документов.</p><button class="shift-action" id="shift-next">Взять задачу</button>';
 if(shift.stage===1)return '<h3 id="shift-heading" tabindex="-1">Зайди в бюро Ильи</h3><p>Илья описал сверку коммерческого и предварительного инвойсов: точное совпадение модели и цены, порядок дат, результат в Excel с подсветкой и пояснениями у полей.</p>'+shiftSources()+'<div class="shift-message"><b>Приём для твоей задачи</b><p>Покажи спорное поле, исходное значение и правило проверки. Получателю должно быть понятно, где принять решение.</p></div><p class="small">Это наш перенос приёма на INV-100. Результаты учебной смены не приписываются Илье.</p><button class="shift-action" id="shift-next">Вернуться к своему счёту</button>';
 if(shift.stage===2)return '<h3 id="shift-heading" tabindex="-1">Что поручить агенту?</h3><p>Выбери поручение. От него зависит, что попадёт в проверку до передачи руководителю.</p>'+shiftJobs.map((x,i)=>'<button class="shift-choice" data-job="'+i+'" aria-pressed="'+(shift.job===i)+'">'+esc(x)+'</button>').join('')+'<p id="shift-job-status" role="status"></p>'+(shift.job===0?'<button class="shift-action" id="shift-next">Получить учебный черновик</button>':'')+'<p class="small">В этой смене ответ агента заранее подготовлен. Внешняя модель не вызывается.</p>';

t-calc-status" role="status"></p><button class="shift-action" id="shift-check">Перейти к решению</button><p class="small">Ответ не подставляется автоматически. Разбор откроется после фиксации твоей записки.</p>';

function shiftPage(){
 el('detail').innerHTML='<section class="shift"><div class="shift-top"><div><span class="shift-badge">Бюро сверки · одна игровая смена</span><h2>За какой итог ты подпишешься?</h2><p>Проверь работу агента и подготовь записку руководителю по счёту INV-100.</p></div><a href="#play-1">К карте практиков</a></div><div class="shift-layout"><aside class="shift-scene">'+shiftRoom()+'<ol class="shift-progress" aria-label="Этапы смены">'+shiftSteps.map((s,i)=>'<li><button data-stage="'+i+'" '+(i>shift.unlocked?'disabled':'')+' '+(i===shift.stage?'aria-current="step"':'')+'>'+String(i+1)+'. '+s+'</button></li>').join('')+'</ol><p class="shift-scene-caption">От опыта практика — к проверке источника и твоему решению.</p></aside><section class="shift-book" aria-label="Рабочий блокнот">'+shiftContent()+'<p class="shift-save" id="shift-save">'+(shiftStorageOK?'Черновик сохраняется в этом браузере.':'Сохранение в браузере недоступно. Скачайте записку до закрытия.')+'</p></section></div><p class="shift-foot">Источники опыта — реальные ветки сообщества. Ситуация, поручение и ответ агента — учебная реконструкция. <button id="shift-reset">Начать новую попытку</button></p></section>';
 for(const b of document.querySelectorAll('[data-stage]'))b.onclick=()=>shiftGo(Number(b.dataset.stage));
 if(el('shift-next'))el('shift-next').onclick=()=>shiftGo(shift.stage+1);
 for(const b of document.querySelectorAll('[data-job]'))b.onclick=()=>{shift.job=Number(b.dataset.job);shiftSave();shiftPage();el('shift-job-status').textContent=shift.job===0?'Поручение сохраняет оригинал и включает независимый расчёт.':shift.job===1?'Эта проверка сравнит итоговые поля между собой. Добавь пересчёт снизу вверх по ставкам позиций.':'Расхождение указывает на вопрос. Правильное значение ещё нужно подтвердить у ответственного человека.'};
 if(el('shift-document'))el('shift-document').ontoggle=()=>{if(el('shift-document').open){shift.source=true;shiftSave()}};
 for(const input of document.querySelectorAll('[data-calc]'))input.oninput=()=>{shift.calc[input.dataset.calc]=input.value;shiftSave()};
 if(el('shift-check'))el('shift-check').onclick=()=>{
  const target=el('shift-calc-status');
  if(!shift.source){target.textContent='Открой фрагмент исходного документа перед решением.';target.className='shift-alert';return}
  if(['a','b','c','subtotal','tax'].some(k=>shiftNumber(shift.calc[k])===null)){target.textContent='Заполни все пять сумм числами с точностью до цента.';target.className='shift-alert';return}
  shiftGo(4);
 };
 if(el('shift-back-calc'))el('shift-back-calc').onclick=()=>shiftGo(3);
 for(const [id,key] of [['s-decision','decision'],['s-basis','basis'],['s-memo','memo'],['s-revision','revision']])if(el(id))el(id).oninput=()=>{shift[key]=el(id).value;shiftSave()};
 if(el('shift-form'))el('shift-form').onsubmit=e=>{e.preventDefault();if(!shift.fixed){shift.fixed=JSON.parse(JSON.stringify({memo:shift.memo.trim(),basis:shift.basis.trim(),decision:shift.decision,calc:shift.calc,job:shift.job}));}shiftGo(5)};
 if(el('shift-download'))el('shift-download').onclick=()=>shiftDownload();
 if(el('shift-review'))el('shift-review').onclick=()=>{shift.review=true;shiftSave();shiftPage();document.querySelector('.shift-reveal').scrollIntoView({block:'start'})};
 if(el('shift-download-revised'))el('shift-download-revised').onclick=()=>{if(shift.revision.trim().length<12){el('shift-revision-status').textContent='Запиши, что уточнилось после сверки, или скачай первую записку без дополнения.';return}shiftDownload(true)};
 el('shift-reset').onclick=()=>{if(!window.confirm('Начать новую попытку? Сначала скачайте записку: текущая попытка будет удалена из этого браузера.'))return;shift={stage:0,unlocked:0,source:false,job:null,calc:{},memo:'',basis:'',decision:'',fixed:null,review:false,revision:''};shiftGo(0)};
}

 else if(hash==='#shift')shiftPage();
 else if(hash==='#project')projectPage();
 else if(hash==='#sources'){
